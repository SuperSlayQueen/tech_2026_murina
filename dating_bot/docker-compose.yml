services:
  postgres:
    image: postgres:15-alpine
    container_name: dating_bot_postgres
    environment:
      POSTGRES_USER: dating_user
      POSTGRES_PASSWORD: dating_password
      POSTGRES_DB: dating_bot
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dating_user -d dating_bot"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - dating_network

  redis:
    image: redis:7-alpine
    container_name: dating_bot_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - dating_network

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: dating_bot_rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - dating_network

  bot:
    build: .
    container_name: dating_bot
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://dating_user:dating_password@postgres:5432/dating_bot
      REDIS_HOST: redis
      RABBITMQ_HOST: rabbitmq
    volumes:
      - ./:/app
    command: python -m src.bot.main
    networks:
      - dating_network

  celery_worker:
    build: .
    container_name: dating_bot_celery_worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://dating_user:dating_password@postgres:5432/dating_bot
      REDIS_HOST: redis
      RABBITMQ_HOST: rabbitmq
    volumes:
      - ./:/app
    command: celery -A src.tasks.celery_app:celery_app worker --loglevel=INFO
    networks:
      - dating_network

  celery_beat:
    build: .
    container_name: dating_bot_celery_beat
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://dating_user:dating_password@postgres:5432/dating_bot
      REDIS_HOST: redis
      RABBITMQ_HOST: rabbitmq
    volumes:
      - ./:/app
    command: celery -A src.tasks.celery_app:celery_app beat --loglevel=INFO
    networks:
      - dating_network

networks:
  dating_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data: